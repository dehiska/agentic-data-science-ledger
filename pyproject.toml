[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ds-ledger"
version = "0.1.0"
description = "Agentic Data Science Ledger — parse and track DS experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nbformat>=5.9.2",
    "astunparse>=1.6.3",
]

[project.optional-dependencies]
full = [
    "python-docx>=1.1.0",
    "pandas>=2.0.3",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.2",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.30.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-huggingface>=0.0.3",
    "langchain-text-splitters>=0.2.0",
]

[project.scripts]
agentic-ledger = "agentic_ds_ledger.cli:main"

[tool.setuptools]
packages = ["agentic_ds_ledger", "agentic_ds_ledger.agents"]

[tool.setuptools.package-dir]
"agentic_ds_ledger" = "src"
"agentic_ds_ledger.agents" = "src/agents"
